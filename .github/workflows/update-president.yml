name: Update Roblox President

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-president:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find current President
        shell: python
        run: |
          import json
          import urllib.request
          import urllib.parse

          GROUP_ID = 1077029685
          ROLE_NAME = "President"

          headers = {
              "User-Agent": "Roblox-President-Board/1.0"
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          # Find the President role ID
          roles_url = f"https://groups.roblox.com/v1/groups/{GROUP_ID}/roles"
          roles_data = get_json(roles_url)

          role_id = None

          for role in roles_data.get("roles", []):
              if role.get("name") == ROLE_NAME:
                  role_id = role.get("id")
                  break

          result = {
              "status": "none",
              "count": 0,
              "president": None
          }

          if role_id is not None:
              members = []
              cursor = None

              while True:
                  url = (
                      f"https://groups.roblox.com/v1/groups/{GROUP_ID}"
                      f"/roles/{role_id}/users"
                      f"?limit=100&sortOrder=Asc"
                  )

                  if cursor:
                      url += "&cursor=" + urllib.parse.quote(cursor)

                  data = get_json(url)

                  for member in data.get("data", []):
                      members.append(member)

                      # We only need to distinguish 0, 1 and 2+
                      if len(members) >= 2:
                          break

                  if len(members) >= 2:
                      break

                  cursor = data.get("nextPageCursor")

                  if not cursor:
                      break

              if len(members) == 1:
                  member = members[0]

                  user_id = (
                      member.get("userId")
                      or member.get("id")
                      or member.get("user", {}).get("userId")
                      or member.get("user", {}).get("id")
                  )

                  username = (
                      member.get("username")
                      or member.get("name")
                      or member.get("user", {}).get("username")
                      or member.get("user", {}).get("name")
                  )

                  result = {
                      "status": "single",
                      "count": 1,
                      "president": {
                          "userId": user_id,
                          "username": username
                      }
                  }

              elif len(members) >= 2:
                  result = {
                      "status": "multiple",
                      "count": len(members),
                      "president": None
                  }

          with open("president.json", "w", encoding="utf-8") as file:
              json.dump(result, file, indent=2)

          print(json.dumps(result, indent=2))

      - name: Save updated President
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add president.json

          if git diff --cached --quiet; then
            echo "President has not changed."
          else
            git commit -m "Update current President"
            git push
          fi
